[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "watchtower"
version = "0.1.0"
description = "Learns public tender portals once, then reads them on a schedule without a model."
requires-python = ">=3.11"
dependencies = [
    "cssselect>=1.2",
    "dateparser>=1.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lxml>=5.3",
    "openai>=2.0",
    "pydantic>=2.10",
    "tzdata>=2024.2",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    # Also a runtime dependency (app/fetch); listed here too because CI installs only this group
    # for the contract test, whose client is httpx.
    "httpx>=0.27",
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
include = ["app", "app.*", "mock_portal", "mock_portal.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root on the path, so tests in sub-folders can share helpers (tests.docs.conftest).
pythonpath = ["."]
