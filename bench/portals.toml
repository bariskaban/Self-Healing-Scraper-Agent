# Test portals for end-to-end runs (Q8). Read with `bench.portals.load_portals()`.
#
# Sources: research/q08-test-portals.md (fetched 20 Nov 2026), research/q04-page-views-measured.md,
# research/patterno-landscape.md with research/sources/patterno-coverage.json (buyer counts),
# research/mentor-answers.md (what the judges are likely to use), and a portal survey of 20 Nov
# checked against those files and against search results.
#
# Never fetch these from an agent session or a test (CLAUDE.md). A person records them once with
# FETCH_MODE=record; everything else works from the recordings.
#
# Fields
#   id          short slug, unique
#   name        what the portal is called
#   country     two letters
#   family      the portal software or platform, as research/patterno-landscape.md names it
#   url         the address a run starts from; absent when no source gives one yet
#   kind        server_html | json_api | js_app | mixed | unknown
#   expect      serve (should reach serving) | fail_login (should end failed, login wall)
#               | unavailable (down or suspended when checked: a control, not a success case)
#   unseen      true: held back for the final test. Do not record, learn or debug on it before.
#   priority    1 Poland (named by the mentor) . 2 Italy . 3 France . 4 NL, AT, ES . 5 Germany
#               (the mentor: test portals "probably won't be German")
#   buyer_sites how many portal addresses Patterno lists on this platform (coverage data)
#   address     how sure we are of `url`:
#                 fetched  opened by our research on 20 Nov 2026
#                 other_page  our research opened another page of this portal, not this one
#                 measured measured in research/q04-page-views-measured.md
#                 search   seen only in a search result or a TED notice quoting it
#                 survey   opened once in a browser by the portal survey, not checked again
#                 example  a buyer subdomain nobody has confirmed: check before recording
#                 doubtful evidence points to another address (see note)
#   robots_disallow_all
#               true: its robots.txt forbids every path to every robot (research/audit.md, Q3).
#               The mentor: robots.txt is obeyed. `load_portals()` leaves it out by default.
#   note        one line
#
# Gaps, for a person to close before recording:
#   Italy has no confirmed address: all four are guessed buyer subdomains (address = "example").
#   France has none either: its guesses are "example" or "doubtful", and the one address our
#   research opened (PLACE) showed a suspension notice. Open them in a browser and update `address`.
#   `load_portals()` leaves the guessed ones (example, doubtful) out unless include_guessed=True.

