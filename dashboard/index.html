<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watchtower</title>
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Operator console for public tender delivery." />
    <link rel="icon" href="/favicon.ico" />
    <script>try{var t=localStorage.getItem("watchtower.theme");if(t!=="light"&&(t!=="system"||matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch(e){document.documentElement.classList.add("dark")}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/spa-main.tsx"></script>
  </body>
</html>
